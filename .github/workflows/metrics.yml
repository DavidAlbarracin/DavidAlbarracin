name: Metrics
on:
  # Se ejecuta automáticamente todos los días a la medianoche
  schedule: [{cron: "0 0 * * *"}]
  # Permite ejecutar el workflow manualmente desde la pestaña "Actions"
  workflow_dispatch:
  # Se ejecuta automáticamente cada vez que haces un push a la rama main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Usa el token automático de GitHub (no necesitas configurar nada extra)
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # Configuraciones
          user: DavidAlbarracin
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Bogota
          
          # Activar plugin de lenguajes más usados
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%